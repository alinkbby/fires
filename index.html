<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130e1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Огоньки">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Огоньки сна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
:root {
  /* Pre-dawn night world, one phone-width column: the flame that matters right now is the hero, the other flames are rows under it. */
  --night: #130e1b;
  --panel: #1c1426;
  --panel-2: #261c33;
  --line: #3a2c48;
  --text: #f7eee6;
  --muted: #ae9fb4;
  --ember: #ff7a2f;
  --dawn: #ffc27a;
  --ice: #8cc8ff;
  --ash: #6a5f73;
  --danger: #ff9a9a;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--text); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(110% 50% at 50% 112%, rgba(255,122,47,.22), rgba(255,122,47,0) 62%),
    radial-gradient(80% 40% at 90% -10%, rgba(140,120,255,.12), rgba(140,120,255,0) 70%); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--dawn); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 22px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.date { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
h1 em { font-style: normal; color: var(--ember); }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; font-size: 24px; line-height: 1; padding: 0; }

/* hero */
.hero { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.hero-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 0; line-height: 1.25; }
.chip { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip-edit { background: rgba(255,122,47,.08); border-color: rgba(255,122,47,.45); color: var(--dawn); font-family: var(--font-body); font-weight: 600; padding: 6px 12px; flex: none; }
.chip-edit:active { background: rgba(255,122,47,.16); }
.hero-head.goal { display: grid; gap: 10px; justify-items: start; }
.goal-time { margin: 0; display: inline-flex; align-items: center; gap: 10px; background: rgba(255,122,47,.10); border: 1.5px solid rgba(255,122,47,.55); color: var(--dawn); border-radius: 16px; padding: 8px 16px; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.hero-main { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.count { font-family: var(--font-display); font-weight: 800; font-size: 84px; line-height: .9; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.count-sub { color: var(--muted); font-size: 15px; margin-top: 8px; }
.level { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 13px; font-weight: 600; }
.level::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.status { margin: 0; font-size: 16px; font-weight: 600; text-wrap: pretty; }
.status small { display: block; color: var(--muted); font-size: 14px; font-weight: 400; margin-top: 3px; }
.progress { display: grid; gap: 7px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--dawn)); border-radius: inherit; }

.btn { width: 100%; min-height: 58px; border-radius: 18px; border: 0; font-family: var(--font-display); font-weight: 700; font-size: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn-fire { background: linear-gradient(180deg, #ff9d4d, #ff6420); color: #2b0e00; box-shadow: 0 12px 32px -12px rgba(255,100,32,.8), inset 0 1px 0 rgba(255,255,255,.35); }
.btn-fire:active { transform: translateY(1px); }
.btn-ice { background: linear-gradient(180deg, #b0dcff, #6eb0f0); color: #071a2d; }
.btn-off { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-family: var(--font-body); font-weight: 500; font-size: 15px; }
.btn-done { background: rgba(255,122,47,.10); color: var(--dawn); border: 1px solid rgba(255,122,47,.45); }
.btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); min-height: 50px; font-size: 15px; }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,154,154,.4); min-height: 50px; font-size: 15px; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.hero > .link { align-self: center; margin-top: -8px; }

.restore { border: 1px solid rgba(140,200,255,.35); background: rgba(140,200,255,.07); border-radius: 20px; padding: 14px; display: grid; gap: 10px; }
.restore p { margin: 0; font-size: 14px; }
.restore b { color: var(--ice); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.restores { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ice); }
.dots i.on { background: var(--ice); box-shadow: 0 0 6px rgba(140,200,255,.6); }

/* flame */
.flame { position: relative; display: grid; place-items: center; width: var(--box, 120px); height: calc(var(--box, 120px) * 1.3); flex: none; }
.flame svg { width: calc(100% * var(--s, 1)); height: auto; overflow: visible; transform-origin: 50% 100%; filter: drop-shadow(0 0 20px var(--glow)); }
.flame .fl { transform-origin: 50% 100%; animation: flick 2.6s ease-in-out infinite; }
.flame .fl-in { transform-origin: 50% 100%; animation: flick2 1.7s ease-in-out infinite; }
.flame.is-wait svg { opacity: .66; filter: saturate(.75); }
.flame.is-wait .fl { animation-duration: 4s; }
.flame.is-dying svg { opacity: .38; filter: grayscale(.55); }
.flame.is-out .fl, .flame.is-out .fl-in { animation: none; }
.flame.pop svg { animation: pop .7s cubic-bezier(.2,1.6,.4,1); }
@keyframes flick { 0%,100% { transform: scale(1,1) skewX(0deg); } 35% { transform: scale(1.015,.975) skewX(-1.6deg); } 70% { transform: scale(.985,1.025) skewX(1.4deg); } }
@keyframes flick2 { 0%,100% { transform: scale(1,1); } 50% { transform: scale(.94,1.06); } }
@keyframes pop { 0% { transform: scale(.65); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
.spark { position: absolute; left: 50%; top: 58%; width: 6px; height: 6px; border-radius: 50%; background: var(--dawn); box-shadow: 0 0 8px var(--ember); pointer-events: none; animation: spark .9s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%,-50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity: 0; } }
.loading .flame { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .5; } }

/* rows */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 8px 12px 8px 8px; }
.row-open { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; border-radius: 16px; }
.row-count { font-family: var(--font-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; min-width: 1.1ch; }
.row-text { min-width: 0; display: grid; }
.row-name { font-weight: 600; font-size: 15px; line-height: 1.25; }
.row-status { color: var(--muted); font-size: 13px; }
.pill { min-height: 40px; border-radius: 14px; padding: 8px 14px; border: 0; font-weight: 700; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; }
.pill.fire { background: linear-gradient(180deg, #ff9d4d, #ff6420); color: #2b0e00; }
.pill.ice { background: linear-gradient(180deg, #b0dcff, #6eb0f0); color: #071a2d; }
.pill.done { color: var(--dawn); border: 1px solid rgba(255,122,47,.45); }
.pill.off { color: var(--muted); border: 1px dashed var(--line); font-weight: 500; }
.add-card { width: 100%; min-height: 60px; border-radius: 22px; border: 1.5px dashed rgba(255,122,47,.45); background: rgba(255,122,47,.05); color: var(--dawn); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; }
.add-card b { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1; }
.add-card:active { background: rgba(255,122,47,.12); }
.chip-btn.idea { font-weight: 500; color: var(--muted); }

/* rules + notes */
.rules { padding: 6px 4px 0; }
.rules h2 { font-family: var(--font-display); font-size: 14px; font-weight: 700; margin: 0 0 10px; color: var(--dawn); }
.rules ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rules li { position: relative; padding-left: 18px; color: var(--muted); font-size: 14px; max-width: 65ch; }
.rules li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.backup { border-top: 1px solid var(--line); padding: 16px 4px 0; display: grid; gap: 10px; }
.backup h2 { font-family: var(--font-display); font-size: 14px; font-weight: 700; margin: 0; color: var(--dawn); }
textarea { width: 100%; min-height: 160px; border-radius: 14px; border: 1px solid var(--line); background: var(--night); color: var(--text); padding: 12px 14px; font: 13px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }

/* onboarding */
.onboard { gap: 14px; }
.ob-flame { display: grid; place-items: center; padding-top: 4px; }
.ob-title { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.ob-text { margin: 0; color: var(--muted); font-size: 15px; }
.preset { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.preset input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ember); margin: 2px 0 0; }
.preset-body { display: grid; gap: 8px; }
.preset-name { font-weight: 700; font-size: 15px; }
.preset-time { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.preset-time input { width: 124px; }

/* forms */
.field { display: grid; gap: 6px; }
.field > label, .label { font-size: 13px; color: var(--muted); }
input[type=text], input[type=time] { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--night); color: var(--text); padding: 10px 14px; font: inherit; font-size: 16px; }
input[type=time] { font-variant-numeric: tabular-nums; }
.form { display: grid; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* sheet */
.backdrop { position: fixed; inset: 0; background: rgba(6,3,10,.74); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 26px) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px; animation: up .28s ease-out; }
@keyframes up { from { transform: translateY(28px); opacity: .5; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.25; }
.sub-h { margin: 4px 0 0; font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--dawn); }
.close { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); font-size: 22px; line-height: 1; padding: 0; }
.live { display: flex; flex-direction: column; gap: 16px; }
.d-top { display: flex; align-items: center; gap: 12px; }
.d-count { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; }
.d-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 16px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.cal-wrap { display: grid; gap: 10px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cal-title { font-weight: 700; font-size: 15px; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button { width: 40px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); font-size: 16px; padding: 0; }
.cal-nav button:disabled { opacity: .35; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wd { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cell { aspect-ratio: 1; border-radius: 12px; border: 0; background: var(--panel-2); color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; display: grid; place-items: center; padding: 0; }
.cell.on { background: linear-gradient(180deg, #ffa257, #ff6a1f); color: #2b0e00; font-weight: 700; }
.cell.rest { background: rgba(140,200,255,.12); color: var(--ice); box-shadow: inset 0 0 0 1.5px var(--ice); font-weight: 700; }
.cell.miss { background: transparent; color: var(--ash); box-shadow: inset 0 0 0 1px var(--line); }
.cell.future, .cell.pre { background: transparent; color: #54485f; }
.cell.today { outline: 2px solid var(--dawn); outline-offset: 1px; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--text); }
.cal.editing .cell:not(.tap) { opacity: .38; }
.cal.editing .cell.tap:not(.on) { border: 1.5px dashed rgba(255,194,122,.6); color: var(--text); background: rgba(255,194,122,.05); }
.edit-box { border: 1px solid rgba(255,122,47,.45); background: rgba(255,122,47,.07); border-radius: 20px; padding: 14px; display: grid; gap: 12px; }
.edit-box p { margin: 0; font-size: 14px; }
.edit-box b { color: var(--dawn); }

/* last 7 days on the hero */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; background: none; border: 0; padding: 0; border-radius: 14px; }
.wk { display: grid; gap: 4px; justify-items: center; }
.wk-d { font-size: 11px; color: var(--muted); }
.wk-c { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--panel-2); color: var(--muted); }
.wk.on .wk-c { background: linear-gradient(180deg, #ffa257, #ff6a1f); color: #2b0e00; font-weight: 700; }
.wk.rest .wk-c { background: rgba(140,200,255,.12); color: var(--ice); box-shadow: inset 0 0 0 1.5px var(--ice); font-weight: 700; }
.wk.miss .wk-c { background: transparent; color: var(--ash); box-shadow: inset 0 0 0 1px var(--line); }
.wk.pre .wk-c, .wk.future .wk-c { background: transparent; color: #54485f; box-shadow: inset 0 0 0 1px rgba(58,44,72,.5); }
.wk.today .wk-c { outline: 2px solid var(--dawn); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; }
.legend .l-on { background: linear-gradient(180deg, #ffa257, #ff6a1f); }
.legend .l-rest { box-shadow: inset 0 0 0 1.5px var(--ice); }
.legend .l-miss { box-shadow: inset 0 0 0 1px var(--ash); }
.cal-info { min-height: 1.45em; font-size: 14px; margin: 0; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 40; background: var(--panel-2); border: 1px solid rgba(255,122,47,.55); color: var(--text); padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: 15px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.7); width: max-content; max-width: calc(100% - 32px); text-align: center; animation: drop .3s ease-out; }
.toast[hidden] { display: none; }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script id="logic">
const OG = (() => {
  'use strict';
  const MAX_RESTORES = 5;
  const RESTORE_WINDOW = 3;
  const pad = n => String(n).padStart(2, '0');
  const ymdLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
  const fromUTC = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  const addDays = (s, n) => fromUTC(parse(s) + n * 864e5);
  const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
  const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
  const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

  const LEVELS = [
    { min: 0, key: 'ash', name: 'погас', gen: '' },
    { min: 1, key: 'spark', name: 'искра', gen: 'искры' },
    { min: 3, key: 'flame', name: 'огонёк', gen: 'огонька' },
    { min: 7, key: 'fire', name: 'костёр', gen: 'костра' },
    { min: 14, key: 'pink', name: 'розовое пламя', gen: 'розового пламени' },
    { min: 30, key: 'blue', name: 'синее пламя', gen: 'синего пламени' },
    { min: 100, key: 'sun', name: 'солнце', gen: 'солнца' },
  ];
  const levelFor = n => { let l = LEVELS[0]; for (const x of LEVELS) if (n >= x.min) l = x; return l; };
  const nextLevel = n => LEVELS.find(l => l.min > n) || null;

  // A habit's "day" can start later than midnight (bedtime: the night of the 18th lasts until 05:00 on the 19th).
  function logicalNow(h, now) {
    const shift = h.shiftMin || 0;
    const t = new Date(now.getTime() - shift * 60000);
    return { day: ymdLocal(t), min: t.getHours() * 60 + t.getMinutes() + shift };
  }

  function analyze(h, now) {
    const { day: T, min } = logicalNow(h, now);
    const marks = h.marks || {};
    const restores = h.restores || [];

function monthAdd(ym, n) {

  const d = diffDays(ds, a.T);
  if (d > 0) return { cls: 'future', label: 'ещё впереди' };
  if (d === 0 && a.phase !== 'late') return { cls: 'future', label: 'сегодня, ещё не отмечено' };

}

    ${presets ? `<div class="field"><span class="label">Для сна</span><div class="chips">${presets}</div></div>` : ''}
    <form id="add-form" class="form" novalidate>
      <div class="field"><label for="a-name">${presets ? 'Или свой огонёк' : 'Как назовём огонёк'}</label><input id="a-name" type="text" maxlength="60" placeholder="Напиши что угодно" autocomplete="off">
        <div class="chips" aria-label="Идеи">${IDEAS.map(n => `<button type="button" class="chip-btn idea" data-action="fill-name" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>
      <div class="field"><label for="a-until">Отметить можно до</label><input id="a-until" type="time"><p class="hint">${KIND.custom.hint}</p></div>
      <button class="btn btn-fire" type="submit">Зажечь огонёк</button>
    </form>
  </div></div>`;
}
let lastLive = '', lastFocus = null;
function renderLive() {
  const el = document.getElementById('live');
  const h = byId(state.ui.id);
  if (!el || !h) return;
  const html = detailLive(h);
  if (html !== lastLive) { el.innerHTML = html; lastLive = html; }
}
function openSheet(ui) {
  lastFocus = document.activeElement;
  state.ui = ui;
  lastLive = '';
  const h = ui.sheet === 'detail' ? byId(ui.id) : null;
  if (ui.sheet === 'detail') $sheet.innerHTML = detailView(h);
  else if (ui.sheet === 'add') $sheet.innerHTML = addView();
  if (ui.sheet === 'detail') renderLive();
  document.body.style.overflow = 'hidden';
  const c = $sheet.querySelector('.close');
  if (c) c.focus();
}
function closeSheet() {
  state.ui = { sheet: null };
  $sheet.innerHTML = '';
  document.body.style.overflow = '';
  if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} }
}
function renderAll() {
  renderMain();
  if (state.ui.sheet === 'detail') { if (!byId(state.ui.id)) closeSheet(); else renderLive(); }
}

/* ---------- actions ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3000);
}
function celebrate(id) {
  if (reduceMotion) return;
  document.querySelectorAll(`[data-flame="${id}"]`).forEach(el => {
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    const big = el.offsetWidth > 80;
    for (let i = 0; i < (big ? 16 : 8); i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const ang = (-90 + (Math.random() * 150 - 75)) * Math.PI / 180;
      const dist = (big ? 55 : 25) + Math.random() * (big ? 70 : 30);
      s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
      s.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
      s.style.animationDelay = Math.round(Math.random() * 140) + 'ms';
      el.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  });
}
function guardWrite() { if (state.readOnly) { toast('Здесь можно только смотреть'); return false; } return true; }
function doMark(id) {
  const h = byId(id); if (!h || !guardWrite()) return;
  const now = new Date();
  const a = analyze(h, now);
  if (a.phase !== 'open') { renderAll(); return; }
  put({ ...h, marks: { ...h.marks, [a.T]: `${pad(now.getHours())}:${pad(now.getMinutes())}` } });
  const a2 = analyze(byId(id), now);
  celebrate(id);
  toast(MILESTONES[a2.streak] || (a2.streak === 1 ? 'Искра загорелась!' : `Огонёк горит: ${a2.streak} ${dni(a2.streak)} подряд`));
}
function doRestore(id) {
  const h = byId(id); if (!h || !guardWrite()) return;
  const a = analyze(h, new Date());
  if (!a.canRestore) { renderAll(); return; }
  put(applyRestore(h, a));
  celebrate(id);
  toast(`Огонёк вернулся: ${a.merged} ${dni(a.merged)} подряд`);
}
function doUndo(id) {
  const h = byId(id); if (!h || !guardWrite()) return;
  const a = analyze(h, new Date());
  if (a.phase !== 'done' || h.marks[a.T] === undefined || a.min > h.untilMin) return;
  const marks = { ...h.marks }; delete marks[a.T];
  put({ ...h, marks });
  toast('Отметка отменена');
}
function toggleBackfill(ds) {
  const h = byId(state.ui.id);
  if (!h || state.readOnly || !isDay(ds)) return;
  if (diffDays(ds, h.created) >= 0) return;
  if (h.restores.some(r => r.day === ds)) return;
  const marks = { ...h.marks };
  if (marks[ds] !== undefined) delete marks[ds]; else marks[ds] = '';
  put({ ...h, marks });
}
function maxOrder() { return state.habits.reduce((m, h) => Math.max(m, h.order), -1); }
function doStart() {
  if (!guardWrite()) return;
  const list = [];
  for (const [kind, order] of [['wake', 0], ['bed', 1]]) {
    if (!$(`#ob-${kind}`).checked) continue;
    const target = timeToUntil(kind, $(`#ob-${kind}-target`).value);
    const until = Math.max(target, timeToUntil(kind, $(`#ob-${kind}-time`).value));
    list.push(newHabit(kind, KIND[kind].name, until, order, target));
  }
  if (!list.length) { toast('Выбери хотя бы один огонёк'); return; }
  list.forEach(put);
  toast('Огоньки готовы. Прошлые дни можно внести в календаре');
}
function doAddPreset(kind) {
  if (!guardWrite() || !KIND[kind]) return;
  put(newHabit(kind, KIND[kind].name, KIND[kind].defUntil, maxOrder() + 1, KIND[kind].defTarget));
  closeSheet();
  toast('Огонёк добавлен');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const act = t.dataset.action, id = t.dataset.id;
  if (act === 'backdrop') { if (e.target === t) closeSheet(); return; }
  switch (act) {
    case 'mark': doMark(id); break;
    case 'restore': doRestore(id); break;
    case 'undo': doUndo(id); break;
    case 'start': doStart(); break;
    case 'open': { const h = byId(id); if (h) openSheet({ sheet: 'detail', id, month: analyze(h, new Date()).T.slice(0, 7), sel: null, confirmDel: false }); break; }
    case 'add': openSheet({ sheet: 'add' }); break;
    case 'close': closeSheet(); break;
    case 'add-preset': doAddPreset(t.dataset.kind); break;
    case 'time-open': showTimeSheet(id); break;
    case 'backup': doBackup(); break;
    case 'import-open': showImportSheet(); break;
    case 'fill-name': { const i = $('#a-name'); if (i) { i.value = t.dataset.name || ''; i.focus(); } break; }
    case 'cal-prev': case 'cal-next':
      state.ui.month = monthAdd(state.ui.month, act === 'cal-prev' ? -1 : 1);
      state.ui.sel = null; renderLive();
      { const b = document.getElementById(act); if (b && !b.disabled) b.focus(); }
      break;
    case 'cal-sel':
      state.ui.sel = t.dataset.day;
      if (state.ui.edit) toggleBackfill(state.ui.sel);
      renderLive();
      { const c = document.querySelector(`.cell[data-day="${state.ui.sel}"]`); if (c) c.focus(); }
      break;
    case 'edit-on':
      if (!guardWrite()) break;
      state.ui.edit = true; state.ui.sel = null; renderLive();
      { const b = document.getElementById('edit-off'); if (b) b.focus(); }
      break;
    case 'edit-off': {
      state.ui.edit = false; state.ui.sel = null;
      const h = byId(state.ui.id);
      if (h) {
        const a = analyze(h, new Date());
        if (state.ui.month < a.first.slice(0, 7)) state.ui.month = a.first.slice(0, 7);
        renderLive();
        toast(`Готово: ${a.streak} ${dni(a.streak)} подряд`);
      }
      { const b = document.getElementById('edit-on'); if (b) b.focus(); }
      break;
    }
    case 'del': state.ui.confirmDel = true; $('#del').innerHTML = delView(); break;
    case 'del-cancel': state.ui.confirmDel = false; $('#del').innerHTML = delView(); break;
    case 'del-yes': if (guardWrite()) { const delId = state.ui.id; closeSheet(); removeHabit(delId); toast('Огонёк удалён'); } break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (!guardWrite()) return;
  if (f.id === 'edit-form') {
    const h = byId(f.dataset.id); if (!h) return;
    const name = $('#f-name').value.trim();
    if (!name) { toast('Дай огоньку название'); return; }
    const raw = $('#f-until').value;
    const until = (h.kind === 'custom' && !raw) ? 1439 : timeToUntil(h.kind, raw);
    if (h.kind === 'custom') put({ ...h, name, ...windowFor(h.kind, until) });
    else {
      const target = timeToUntil(h.kind, $('#f-target').value);
      if (until < target) { toast('Время отметки не может быть раньше цели'); return; }
      put({ ...h, name, targetMin: target, ...windowFor(h.kind, until, target) });
    }
    $('#sh-title').textContent = name;
    toast('Сохранено');
  } else if (f.id === 'time-form') {
    const h = byId(f.dataset.id); if (!h) return;
    const raw = $('#t-until').value;
    const until = (h.kind === 'custom' && !raw) ? 1439 : timeToUntil(h.kind, raw);
    put({ ...h, ...windowFor(h.kind, until, h.targetMin) });
    closeSheet();
    toast(hasDeadline(byId(h.id)) ? `Готово, теперь отметить можно до ${fmtMin(until)}` : 'Готово, отмечать можно в любое время');
  } else if (f.id === 'import-form') {
    doImport($('#im-text').value);
  } else if (f.id === 'add-form') {
    const name = $('#a-name').value.trim();
    if (!name) { toast('Напиши, что будет значить огонёк'); $('#a-name').focus(); return; }
    const raw = $('#a-until').value;
    put(newHabit('custom', name, raw ? timeToUntil('custom', raw) : 1439, maxOrder() + 1));
    closeSheet();
    toast('Огонёк добавлен, первая отметка ждёт');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.ui.sheet) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderAll(); });
setInterval(() => { if (document.visibilityState !== 'hidden') renderAll(); }, 20000);

// Offline support only where the page is hosted as its own site (GitHub Pages), never inside Claude.
try {
  const ownSite = /\.github\.io$/.test(location.hostname) || location.hostname === 'localhost';
  if (ownSite && 'serviceWorker' in navigator) {
    // When a new version of the app has been installed, reload once so it shows up without reopening.
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded || state.ui.sheet) return;
      reloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { try { r.update(); } catch (e) {} }).catch(() => {});
  }
} catch (e) {}

boot();
})();
</script>
